[package]
name = "knf-dotted"
description = "A leaf value addressed by a dotted path, parsed from key.path=value"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Unpublished until something other than knf depends on it via crates.io.
# A git/path dependency is enough for other projects in the meantime.
publish = false

# thiserror is always on. serde_json is optional behind `json`, and is the JSON
# *parser* for the RHS, not just a value type — there is no serde derive here.
# No anyhow, no clap, no I/O. `cargo tree -p knf-dotted --depth 1` is the enforcement.
[features]
default = ["json"]
json = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
