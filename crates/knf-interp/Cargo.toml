[package]
name = "knf-interp"
description = "${key.path} and ${env:VAR} reference resolution over the knf merge IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# knf-core carries both the merge IR and the path vocabulary (`Seg`, `RefPath`),
# and has no serde_json of its own, so nothing in this tree can type a value the
# way `--set` does. There is no format crate and no `std::env` here —
# environment access is injected through the `Env` trait, which is what keeps
# this crate deterministic and testable without touching process state.
# `cargo tree -p knf-interp --depth 1` is the enforcement.
[dependencies]
knf-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
