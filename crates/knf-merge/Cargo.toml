[package]
name = "knf-merge"
description = "Layered merge over an owned JSON/TOML-superset value tree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The merge semantics are the part of the design still in flux (--null-delete,
# --array-strategy would both change MergeOptions), and a crate boundary on
# crates.io is a semver promise. Unpublished until that stops moving.
publish = false

# thiserror and indexmap, and nothing else. No format crates, no anyhow, no clap,
# no I/O — there are no features to gate because there is nothing to gate.
# `cargo tree -p knf-merge --depth 1` is the enforcement.
[dependencies]
indexmap = "2"
thiserror.workspace = true

# serde_json is a *dev*-dependency only: the table tests are written as JSON
# literals for readability and converted to the IR in tests/common. Dev deps do
# not propagate to consumers, so the no-format-deps promise still holds.
[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
