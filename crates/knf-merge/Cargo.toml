[package]
name = "knf-merge"
description = "Layered merge over JSON-like value trees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The merge semantics are the part of the design still in flux (--null-delete,
# --array-strategy would both change MergeOptions), and a crate boundary on
# crates.io is a semver promise. Unpublished until that stops moving.
publish = false

# thiserror is always on. serde_json and toml are optional behind `json` / `toml`.
# No anyhow, no clap, no I/O. `cargo tree -p knf-merge --depth 1` is the enforcement.
[features]
default = ["json"]
json = ["dep:serde_json"]
toml = ["dep:toml"]

[dependencies]
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
toml = { workspace = true }

[[test]]
name = "toml"
required-features = ["toml"]
