[package]
# `import knf`, published to PyPI as `pyknf` (see pyproject.toml here) and never
# to crates.io. The `knf-cli` wheel and `cargo install knf-cli` build
# `crates/knf`, which stays free of pyo3 (`cargo tree -p knf-cli` is the
# enforcement in CI).
name = "knf-py"
description = "Python bindings for knf-core, bundled with the knf command line"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `_knf` rather than `knf`: the Python package re-exports from it, and a lib
# named `knf` would collide with knf-core's in `cargo doc --workspace --lib`.
[lib]
name = "_knf"
crate-type = ["cdylib"]
# A test harness is an executable, and an extension module has no libpython to
# link one against. Everything here is exercised from Python instead.
test = false
doctest = false

# No `extension-module` feature: pyo3 deprecated it in favour of the
# PYO3_BUILD_EXTENSION_MODULE environment variable, which maturin sets.
[dependencies]
knf-core.workspace = true
anyhow.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39"] }
