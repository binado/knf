[package]
# Published to PyPI as pyknf (via root pyproject.toml), never to crates.io.
name = "knf-py"
description = "Python bindings for knf-core, with the knf command line"
publish = false
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

# Named _knf to avoid colliding with knf-core's lib in cargo doc.
[lib]
name = "_knf"
crate-type = ["cdylib"]
# Extension modules don't link libpython, so Rust test binaries can't run; tested via pytest.
test = false
doctest = false

# pyo3 deprecated the `extension-module` feature in favor of PYO3_BUILD_EXTENSION_MODULE (set by maturin).
# `clap` is used by the included CLI.
# Mirrors knf-cli; the published wheels enable it through pyproject.toml.
[features]
yaml = ["knf-convert/yaml"]

[dependencies]
knf-core.workspace = true
knf-convert.workspace = true
anyhow.workspace = true
clap.workspace = true
tempfile.workspace = true
# Compiled in with the included CLI; its handler is never installed here.
ctrlc.workspace = true
serde_json.workspace = true
toml.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py311"] }
