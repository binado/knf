[package]
name = "knf-core"
description = "Load, merge and emit layered JSON and TOML configuration files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# crates.io already has an unrelated `knf`; the library is still `knf`, so a
# consumer writes `knf-core` in their manifest and `use knf::…` in their code.
[lib]
name = "knf"

# No clap: the flag vocabulary is `knf-cli`'s, and an error raised in this crate
# names key paths and file paths but never a command-line flag.
# `cargo tree -p knf-core --depth 1` is the enforcement.
[dependencies]
anyhow.workspace = true
indexmap = "2"
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"
