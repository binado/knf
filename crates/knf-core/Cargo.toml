[package]
name = "knf-core"
description = "Ordered configuration values, layered merging and interpolation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Package is knf-core because crates.io already has an unrelated knf; consumers still `use knf::...`.
[lib]
name = "knf"

[dependencies]
indexmap = "2"
toml_datetime = "1"
fast-glob.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"
