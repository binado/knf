[package]
# Package is knf-cli because crates.io already has an unrelated knf; the binary stays knf.
name = "knf-cli"
description = "Merge layered configuration files and print the result"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "knf"
path = "src/main.rs"

[dependencies]
knf-core.workspace = true
knf-convert.workspace = true
anyhow.workspace = true
clap.workspace = true
tempfile.workspace = true
# Keeps --exec alive across Ctrl-C so the temp snapshot is deleted on drop.
ctrlc.workspace = true

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true
assert_cmd = "2"
insta = "1"
datatest-stable = "0.3.3"
shlex = "2.0.1"
similar = "3.2.1"

[[test]]
name = "mdtest"
harness = false
