[package]
# crates.io already has an unrelated `knf`; the installed binary is still `knf`.
name = "knf-cli"
description = "Merge layered configuration files and print the result"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "knf"

[[bin]]
name = "knf"
path = "src/main.rs"
required-features = ["cli"]

# The binary is feature-gated; the tests that execute it must be too, or a
# `--no-default-features` run looks for a binary that was never built.
# Edition 2024 keeps autodiscovery on, so library.rs is unaffected.
[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
knf-core.workspace = true
knf-dotted = { workspace = true, features = ["json"] }
knf-interp.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { workspace = true, optional = true }
toml.workspace = true

[dev-dependencies]
assert_cmd = "2"
insta = "1"
tempfile = "3"
