[workspace]
members = ["crates/*"]
# Virtual manifests have no edition, so resolver 3 must be explicit.
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/binado/knf"

[workspace.dependencies]
# Declared at workspace level so key order doesn't depend on which members are built.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fast-glob = "1.1.2"
# Needed alongside serde_json: toml's serializer otherwise buffers into a BTreeMap and sorts keys.
toml = { version = "1", features = ["preserve_order"] }
serde = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["serialize"] }
tempfile = "3"
ctrlc = "3"

# Version is required so cargo publish can rewrite path deps for crates.io.
knf-core = { path = "crates/knf-core", version = "0.8.0" }
knf-convert = { path = "crates/knf-convert", version = "0.8.0" }

[profile.release]
lto = "thin"
strip = true
