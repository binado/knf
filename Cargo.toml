[workspace]
members = ["crates/*"]
# Edition 2024 implies resolver 3, but a *virtual* manifest has no edition of its
# own and does not inherit one from its members, so it must be stated explicitly.
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/binado/knf"

[workspace.dependencies]
# `preserve_order` is declared here rather than in a member so that the
# indexmap-backed Map is the workspace-wide behaviour. Cargo unifies features
# across the graph anyway; making it explicit avoids the failure mode where key
# ordering depends on which members happen to be in the build.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `preserve_order` is needed here as well as on serde_json: `toml`'s document
# serializer buffers into its own map type, which is a BTreeMap by default and
# alphabetises the output regardless of what the IR preserved.
toml = { version = "1", features = ["preserve_order"] }
serde = "1"

# version is required so `cargo publish` can rewrite the path dep to a crates.io
# requirement. Keep it equal to [workspace.package].version.
knf-core = { path = "crates/knf-core", version = "0.1.2" }
# `default-features = false` here rather than at a member: knf-interp wants
# `KeyPath` alone and must not pull serde_json in, and a member cannot turn a
# workspace dependency's default features back off. The CLI opts into `json`
# explicitly, which is the only place the RHS typing rule is wanted.
knf-dotted = { path = "crates/knf-dotted", version = "0.1.2", default-features = false }
knf-interp = { path = "crates/knf-interp", version = "0.1.2" }

[profile.release]
lto = "thin"
strip = true
