[build-system]
requires = ["maturin>=1.14,<2"]
# In-tree wrapper around maturin: stages knf-cli into data/scripts/ so
# `pip wheel .` / `python -m build` produce a wheel with the executable.
build-backend = "knf_build"
backend-path = ["crates/knf-py"]

[project]
name = "knf-cli"
dynamic = ["version"]
description = "Merge layered configuration files: the knf command line and a Python function"
readme = "README.md"
# abi3-py39: one wheel per platform serves every CPython from 3.9 on.
requires-python = ">=3.9"
license = "MIT"
keywords = ["configuration", "json", "toml", "cli", "merge"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/binado/knf"
Issues = "https://github.com/binado/knf/issues"

[tool.maturin]
# One wheel, two things: `import knf` is the pyo3 module built from
# crates/knf-py, and the `knf` executable is knf-cli's binary, which maturin
# cannot build alongside a pyo3 module. The PEP 517 backend stages it into
# `data/scripts/` before calling maturin; `maturin build` / `maturin develop`
# still need `crates/knf-py/stage-cli.sh` first. Without a staged binary the
# data directory is missing and maturin refuses to build, so a wheel without
# the executable cannot ship by accident.
bindings = "pyo3"
manifest-path = "crates/knf-py/Cargo.toml"
module-name = "knf._knf"
python-source = "crates/knf-py/python"
data = "crates/knf-py/data"
# The sdist must contain knf-cli and knf-core, not only the knf-py crate
# cargo-package would emit.
sdist-generator = "git"
exclude = ["**/__pycache__/**"]
locked = true
strip = true
compatibility = "pypi"

[tool.maturin.target.x86_64-apple-darwin]
macos-deployment-target = "10.12"

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "11.0"
