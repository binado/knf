[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "knf-cli"
dynamic = ["version"]
description = "Merge layered configuration files: the knf command line and a Python function"
readme = "README.md"
# abi3-py39: one wheel per platform serves every CPython from 3.9 on.
requires-python = ">=3.9"
license = "MIT"
keywords = ["configuration", "json", "toml", "cli", "merge"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/binado/knf"
Issues = "https://github.com/binado/knf/issues"

[tool.maturin]
# One wheel, two things: `import knf` is the pyo3 module built from
# crates/knf-py, and the `knf` executable is knf-cli's binary, which maturin
# cannot build alongside a pyo3 module. `crates/knf-py/stage-cli.sh` builds it
# into `data/scripts/`, which the wheel installs onto PATH; without that step
# the data directory is missing and maturin refuses to build.
bindings = "pyo3"
manifest-path = "crates/knf-py/Cargo.toml"
module-name = "knf._knf"
python-source = "crates/knf-py/python"
data = "crates/knf-py/data"
exclude = ["**/__pycache__/**"]
locked = true
strip = true
compatibility = "pypi"

[tool.maturin.target.x86_64-apple-darwin]
macos-deployment-target = "10.12"

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "11.0"
