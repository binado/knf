[workspace]
# Only tag and publish when the Release PR is merged, not on every push to main.
release_always = false
# No crates.io baseline yet; cargo-semver-checks has nothing to compare against.
semver_check = false

[[package]]
name = "knf-cli"
# The merge core, the pipeline and reference resolution live in sibling crates;
# their commits belong in the CLI changelog.
changelog_include = ["knf-core", "knf-interp", "knf-config"]

[[package]]
# A frontend, like knf-cli, and never published to crates.io — but its version is
# the workspace's, so release-plz still bumps it and the PyPI job still has a
# version to build. No changelog of its own: knf-cli's `changelog_include` covers
# its *dependencies*, and a sibling frontend is not one of them.
name = "knf-py"
publish = false
changelog_update = false
