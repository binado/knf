[workspace]
# Only tag and publish when the Release PR is merged, not on every push to main.
release_always = false
# No crates.io baseline yet; cargo-semver-checks has nothing to compare against.
semver_check = false

[[package]]
name = "knf-cli"
# The library and the Python module live in sibling crates; their commits
# belong in the CLI changelog, since knf-cli is what ships both.
changelog_include = ["knf-core", "knf-py"]

# The Python module, published to PyPI as `pyknf` from release-plz.yml when the
# knf-cli-v* tag is pushed. Never on crates.io, and versioned by the workspace.
# A package entry defaults publish to true, which release-plz rejects when
# Cargo.toml sets publish = false, so both flags have to be explicit.
[[package]]
name = "knf-py"
release = false
publish = false
