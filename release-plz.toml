[workspace]
# Only tag and publish when the Release PR is merged, not on every push to main.
release_always = false
# No crates.io baseline yet; cargo-semver-checks has nothing to compare against.
semver_check = false

[[package]]
name = "knf-cli"
# The library and the Python module live in sibling crates; their commits
# belong in the CLI changelog, since knf-cli is what ships both.
changelog_include = ["knf-core", "knf-convert", "knf-py"]
git_tag_name = "v{{ version }}"

# The CLI is the canonical GitHub release for the workspace version. Keep
# publishing these libraries to crates.io without creating separate tags/releases.
[[package]]
name = "knf-core"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "knf-convert"
git_tag_enable = false
git_release_enable = false

# The Python module, the only PyPI package. Track its changes so Python-only
# updates bump the shared workspace version and produce the canonical v<version> tag.
# Its changes are included in the CLI changelog, and the workflow publishes
# PyPI wheels from the CLI tag, so it needs no separate release or tag.
[[package]]
name = "knf-py"
release = false
publish = false

# Test-only harness; never versioned, tagged or published.
[[package]]
name = "knf-mdtest"
release = false
