[workspace]
# Only tag and publish when the Release PR is merged, not on every push to main.
release_always = false
# No crates.io baseline yet; cargo-semver-checks has nothing to compare against.
semver_check = false

[[package]]
name = "knf-cli"
# The library and the Python module live in sibling crates; their commits
# belong in the CLI changelog, since knf-cli is what ships both.
changelog_include = ["knf-core", "knf-py"]

# The Python module, the only PyPI package. Track its changes so Python-only
# updates bump the shared workspace version and produce a knf-cli release tag.
# Git-only mode does not publish the crate to crates.io. The workflow publishes
# the PyPI wheels from the knf-cli tag; its changelog includes these commits.
[[package]]
name = "knf-py"
git_only = true
publish = false
changelog_update = false
