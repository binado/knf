[workspace]
# Only tag and publish when the Release PR is merged, not on every push to main.
release_always = false
# No crates.io baseline yet; cargo-semver-checks has nothing to compare against.
semver_check = false

[[package]]
name = "knf-cli"
# The library lives in a sibling crate; its commits belong in the CLI changelog.
changelog_include = ["knf-core"]
