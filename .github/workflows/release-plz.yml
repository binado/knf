name: Release-plz

on:
  push:
    branches:
      - main
    # release-plz tags knf-cli-v<version> when a Release PR merges. A tag push
    # from GITHUB_TOKEN does not start a run, so the release job dispatches
    # this workflow on that tag. A tag pushed by a person starts it directly.
    tags: ["knf-cli-v*"]
  workflow_dispatch:

jobs:
  # Tag and GitHub-release whatever the last Release PR bumped.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'binado' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      knf_released: ${{ steps.knf-release.outputs.released }}
      knf_version: ${{ steps.knf-release.outputs.version }}
    permissions:
      contents: write
      pull-requests: read
      # Dispatching the PyPI jobs below. The tag push itself does not.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Find the knf-cli release
        id: knf-release
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version="$(jq -r 'map(select(.package_name == "knf-cli")) | first | .version // empty' <<<"$RELEASES")"
          if [[ -n "$version" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the PyPI publish
        if: ${{ steps.knf-release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.knf-release.outputs.version }}
        run: gh workflow run release-plz.yml --ref "knf-cli-v${VERSION}"

  # The workspace version the pyknf wheels must match.
  resolve-pypi:
    name: Resolve PyPI publish
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'binado' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/knf-cli-v')) }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Plan the upload
        id: plan
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/knf-cli-v* ]]; then
            tag="${GITHUB_REF_NAME#knf-cli-v}"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::tag knf-cli-v${tag} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-pypi-wheels:
    name: PyPI wheel (${{ matrix.platform.family }}, ${{ matrix.platform.target }})
    needs: resolve-pypi
    if: ${{ github.repository_owner == 'binado' && needs.resolve-pypi.result == 'success' }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - family: manylinux
            runner: ubuntu-22.04
            target: x86_64
            manylinux: "2_17"
            docker_platform: linux/amd64
            test_image: python:3.12-bookworm
          - family: manylinux
            runner: ubuntu-22.04
            target: aarch64
            manylinux: "2_17"
            docker_platform: linux/arm64
            test_image: python:3.12-bookworm
          - family: musllinux
            runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            docker_platform: linux/amd64
            test_image: python:3.12-alpine
          - family: musllinux
            runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            docker_platform: linux/arm64
            test_image: python:3.12-alpine
          - family: macos
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
          - family: macos
            runner: macos-15
            target: aarch64
            manylinux: "off"
          - family: windows
            runner: windows-latest
            target: x64
            manylinux: "off"
          - family: windows
            runner: windows-11-arm
            target: aarch64
            manylinux: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up ARM64 emulation
        if: ${{ matrix.platform.target == 'aarch64' && (matrix.platform.family == 'manylinux' || matrix.platform.family == 'musllinux') }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # The pyo3 module; maturin reads the pyproject.toml beside the manifest.
      - name: Build pyknf wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          maturin-version: v1.14.1
          args: --release --locked --compatibility pypi -m crates/knf-py/Cargo.toml --out dist/pyknf
          sccache: true
      - name: Smoke-test native wheels
        if: ${{ matrix.platform.family == 'macos' || matrix.platform.family == 'windows' }}
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-index --find-links dist/pyknf pyknf
          python -c "import knf; assert knf.deep_merge([], override={'a': 1}) == {'a': 1}"
      - name: Smoke-test Linux wheels
        if: ${{ matrix.platform.family == 'manylinux' || matrix.platform.family == 'musllinux' }}
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.platform.docker_platform }}" \
            -v "${{ github.workspace }}/dist:/dist" \
            "${{ matrix.platform.test_image }}" \
            sh -c 'python -m pip install --no-index --find-links /dist/pyknf pyknf && python -c "import knf; assert knf.deep_merge([], override={\"a\": 1}) == {\"a\": 1}"'
      - name: Upload pyknf wheel
        uses: actions/upload-artifact@v6
        with:
          name: pyknf-${{ matrix.platform.family }}-${{ matrix.platform.target }}
          path: dist/pyknf/*.whl
          if-no-files-found: error

  # The pyknf trusted publisher names this workflow file and the `pypi` environment.
  publish-pypi:
    name: Publish pyknf to PyPI
    needs: [resolve-pypi, build-pypi-wheels]
    if: ${{ github.repository_owner == 'binado' && needs.resolve-pypi.result == 'success' && needs.build-pypi-wheels.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-${{ needs.resolve-pypi.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download pyknf wheels
        uses: actions/download-artifact@v7
        with:
          pattern: pyknf-*
          path: dist/pyknf
          merge-multiple: true
      - name: Verify wheel set
        shell: bash
        env:
          VERSION: ${{ needs.resolve-pypi.outputs.version }}
        run: |
          test "$(find dist -type f -name '*.tar.gz' -print | wc -l)" -eq 0
          mapfile -t wheels < <(find dist/pyknf -maxdepth 1 -type f -name '*.whl' -print | sort)
          test "${#wheels[@]}" -eq 8
          for wheel in "${wheels[@]}"; do
            case "$(basename "$wheel")" in
              "pyknf-$VERSION"-*) ;;
              *) echo "unexpected wheel: $wheel" >&2; exit 1 ;;
            esac
          done
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
      # attest-action globs the path as given. A directory without a trailing
      # slash matches the directory itself, not the wheels in it.
      - name: Generate PyPI attestations
        uses: astral-sh/attest-action@v0.0.6
        with:
          paths: dist/pyknf/*
      - name: Publish wheels
        run: uv publish --trusted-publishing always dist/pyknf/*.whl

  # Open or refresh the PR that bumps versions and the changelog.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'binado' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
