name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  # Tag and GitHub-release whatever the last Release PR bumped.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'binado' }}
    outputs:
      knf_released: ${{ steps.knf-release.outputs.released }}
      knf_version: ${{ steps.knf-release.outputs.version }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Find the knf-cli release
        id: knf-release
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version="$(jq -r 'map(select(.package_name == "knf-cli")) | first | .version // empty' <<<"$RELEASES")"
          if [[ -n "$version" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build-pypi-wheels:
    name: PyPI wheel (${{ matrix.platform.family }}, ${{ matrix.platform.target }})
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.knf_released == 'true' }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - family: manylinux
            runner: ubuntu-22.04
            target: x86_64
            manylinux: "2_17"
            docker_platform: linux/amd64
            test_image: python:3.12-bookworm
          - family: manylinux
            runner: ubuntu-22.04
            target: aarch64
            manylinux: "2_17"
            docker_platform: linux/arm64
            test_image: python:3.12-bookworm
          - family: musllinux
            runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            docker_platform: linux/amd64
            test_image: python:3.12-alpine
          - family: musllinux
            runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            docker_platform: linux/arm64
            test_image: python:3.12-alpine
          - family: macos
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
          - family: macos
            runner: macos-15
            target: aarch64
            manylinux: "off"
          - family: windows
            runner: windows-latest
            target: x64
            manylinux: "off"
          - family: windows
            runner: windows-11-arm
            target: aarch64
            manylinux: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up ARM64 emulation
        if: ${{ matrix.platform.target == 'aarch64' && (matrix.platform.family == 'manylinux' || matrix.platform.family == 'musllinux') }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build knf-cli wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          maturin-version: v1.14.1
          args: --release --locked --compatibility pypi --out dist/knf-cli
          sccache: true
      # The pyo3 module; maturin reads the pyproject.toml beside the manifest.
      - name: Build pyknf wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          maturin-version: v1.14.1
          args: --release --locked --compatibility pypi -m crates/knf-py/Cargo.toml --out dist/pyknf
          sccache: true
      # pyknf alone, with no index: its knf-cli dependency must resolve from dist/.
      - name: Smoke-test native wheels
        if: ${{ matrix.platform.family == 'macos' || matrix.platform.family == 'windows' }}
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-index --find-links dist/knf-cli --find-links dist/pyknf pyknf
          knf --version
          test "$(knf --set smoke=true --compact)" = '{"smoke":true}'
          python -c "import knf; assert knf.deep_merge([], override={'a': 1}) == {'a': 1}"
      - name: Smoke-test Linux wheels
        if: ${{ matrix.platform.family == 'manylinux' || matrix.platform.family == 'musllinux' }}
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.platform.docker_platform }}" \
            -v "${{ github.workspace }}/dist:/dist" \
            "${{ matrix.platform.test_image }}" \
            sh -c 'python -m pip install --no-index --find-links /dist/knf-cli --find-links /dist/pyknf pyknf && knf --version && knf --set smoke=true --compact >/dev/null && python -c "import knf; assert knf.deep_merge([], override={\"a\": 1}) == {\"a\": 1}"'
      - name: Upload knf-cli wheel
        uses: actions/upload-artifact@v6
        with:
          name: knf-cli-${{ matrix.platform.family }}-${{ matrix.platform.target }}
          path: dist/knf-cli/*.whl
          if-no-files-found: error
      - name: Upload pyknf wheel
        uses: actions/upload-artifact@v6
        with:
          name: pyknf-${{ matrix.platform.family }}-${{ matrix.platform.target }}
          path: dist/pyknf/*.whl
          if-no-files-found: error

  # Both distributions, from one job: each PyPI project's trusted publisher
  # names this workflow and the `pypi` environment.
  publish-pypi:
    name: Publish knf-cli and pyknf to PyPI
    needs: [release-plz-release, build-pypi-wheels]
    if: ${{ needs.release-plz-release.outputs.knf_released == 'true' }}
    runs-on: ubuntu-latest
    # PyPI's trusted publisher must name this workflow and environment exactly.
    environment: pypi
    concurrency:
      group: pypi-${{ needs.release-plz-release.outputs.knf_version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download knf-cli wheels
        uses: actions/download-artifact@v7
        with:
          pattern: knf-cli-*
          path: dist/knf-cli
          merge-multiple: true
      - name: Download pyknf wheels
        uses: actions/download-artifact@v7
        with:
          pattern: pyknf-*
          path: dist/pyknf
          merge-multiple: true
      - name: Verify wheel sets
        shell: bash
        env:
          VERSION: ${{ needs.release-plz-release.outputs.knf_version }}
        run: |
          test "$(find dist -type f -name '*.tar.gz' -print | wc -l)" -eq 0
          for pair in knf-cli:knf_cli pyknf:pyknf; do
            dir="dist/${pair%%:*}" prefix="${pair##*:}"
            mapfile -t wheels < <(find "$dir" -maxdepth 1 -type f -name '*.whl' -print | sort)
            test "${#wheels[@]}" -eq 8
            for wheel in "${wheels[@]}"; do
              case "$(basename "$wheel")" in
                "$prefix-$VERSION"-*) ;;
                *) echo "unexpected wheel: $wheel" >&2; exit 1 ;;
              esac
            done
          done
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
      - name: Generate PyPI attestations
        uses: astral-sh/attest-action@v0.0.6
        with:
          paths: dist/knf-cli dist/pyknf
      # knf-cli first: pyknf depends on it.
      - name: Publish wheels
        run: |
          uv publish --trusted-publishing always dist/knf-cli/*.whl
          uv publish --trusted-publishing always dist/pyknf/*.whl

  # Open or refresh the PR that bumps versions and the changelog.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'binado' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
