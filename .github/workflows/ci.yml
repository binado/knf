name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      # The cli feature split exists so the library builds without clap; CI
      # must exercise that configuration or it silently rots.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features
      - run: cargo build --workspace --no-default-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Create crate packages
        run: cargo package --workspace --locked --no-verify
      - name: Verify local CLI installation
        run: cargo install --path crates/knf --locked
      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: "2_17"
          maturin-version: v1.14.1
          args: --release --locked --compatibility pypi --out dist
      - name: Verify Python wheel installation
        run: |
          python -m venv /tmp/knf-wheel-test
          /tmp/knf-wheel-test/bin/pip install --no-deps dist/*.whl
          /tmp/knf-wheel-test/bin/knf --version
          test "$(/tmp/knf-wheel-test/bin/knf --set smoke=true --compact)" = '{"smoke":true}'
