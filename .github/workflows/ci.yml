name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package license copies
        run: |
          for crate in crates/*; do
            cmp LICENSE "$crate/LICENSE"
          done
      - name: Create all crate packages
        run: cargo package --workspace --locked --no-verify
      - name: Verify package README and LICENSE listings
        run: |
          for manifest in crates/*/Cargo.toml; do
            listing="$(cargo package --locked --no-verify --list --manifest-path "$manifest")"
            grep -Fxq LICENSE <<<"$listing"
            grep -Fxq README.md <<<"$listing"
          done
      - name: Verify local CLI installation
        run: cargo install --path crates/toargv --locked
