name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-latest
    env:
      # knf-py is a pyo3 extension module: its Python symbols come from the
      # interpreter that loads it, so it must not link libpython (which the
      # runner may not have). maturin sets this itself when building the wheel.
      PYO3_BUILD_EXTENSION_MODULE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      # Enforce crate boundaries: knf-core stays clap-free, knf-cli stays pyo3-free.
      - name: Dependency boundary
        run: |
          if cargo tree -p knf-core --depth 1 --edges normal | tail -n +2 | grep -q clap; then
            echo "::error::knf-core must not depend on clap"
            cargo tree -p knf-core --depth 1 --edges normal
            exit 1
          fi
          if cargo tree -p knf-cli --edges normal | grep -q pyo3; then
            echo "::error::knf-cli must not depend on pyo3"
            cargo tree -p knf-cli --edges normal
            exit 1
          fi
      # --lib avoids target/doc/knf collision between knf-core's lib and knf-cli's bin.
      - run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Create crate packages
        run: cargo package --workspace --locked --no-verify
      - name: Verify local CLI installation
        run: cargo install --path crates/knf --locked
      # maturin reads the root pyproject.toml, which points at crates/knf-py.
      - name: Build pyknf wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: "2_17"
          maturin-version: v1.14.1
          args: --release --locked --compatibility pypi --out dist
      - name: Verify Python wheel installation
        env:
          # The binary installed by `cargo install` above.
          KNF_TEST_STANDALONE: /home/runner/.cargo/bin/knf
        run: |
          python -m venv /tmp/knf-wheel-test
          /tmp/knf-wheel-test/bin/pip install --no-index --find-links dist pyknf
          /tmp/knf-wheel-test/bin/pip install pytest
          /tmp/knf-wheel-test/bin/knf --version
          test "$(/tmp/knf-wheel-test/bin/knf -c smoke=true --compact)" = '{"smoke":true}'
          PATH="/tmp/knf-wheel-test/bin:$PATH" /tmp/knf-wheel-test/bin/python -m pytest python/tests
