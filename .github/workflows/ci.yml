name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      # The dependency direction is the design, so check it rather than trusting
      # the manifests' comments. `--edges normal` excludes dev-dependencies:
      # knf-core's table tests are written as JSON literals and take serde_json
      # that way, which no consumer of the crate ever sees.
      - name: Dependency boundaries
        run: |
          set -euo pipefail
          forbid() {
            if cargo tree -p "$1" --depth 1 --edges normal | tail -n +2 | grep -qE "$2"; then
              echo "::error::$1 must not depend on $2"
              cargo tree -p "$1" --depth 1 --edges normal
              exit 1
            fi
          }
          forbid knf-core   'serde_json|toml|clap|anyhow'
          forbid knf-interp 'serde_json|toml|clap|anyhow'
          forbid knf-config 'clap'
      # --lib: knf-config's lib and knf-cli's bin are both named `knf`, and
      # rustdoc writes both to target/doc/knf. The binary has no public API to
      # document, so documenting lib targets only is the fix, not a workaround.
      - run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Create crate packages
        run: cargo package --workspace --locked --no-verify
      - name: Verify local CLI installation
        run: cargo install --path crates/knf --locked
      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: "2_17"
          maturin-version: v1.14.1
          args: --release --locked --compatibility pypi --out dist
      - name: Verify Python wheel installation
        run: |
          python -m venv /tmp/knf-wheel-test
          /tmp/knf-wheel-test/bin/pip install --no-deps dist/*.whl
          /tmp/knf-wheel-test/bin/knf --version
          test "$(/tmp/knf-wheel-test/bin/knf --set smoke=true --compact)" = '{"smoke":true}'
